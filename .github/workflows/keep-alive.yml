name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "OK: Supabase is awake."
            exit 0
          elif [ "$CODE" = "540" ]; then
            echo "ERROR: Project is paused. Resume it from the Supabase dashboard."
            exit 1
          else
            echo "ERROR: Unexpected status $CODE"
            cat /tmp/body.txt
            exit 1
          fi
