name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL }}
          RAW_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set +e
          URL=$(printf '%s' "$RAW_URL" | tr -d '[:space:]')
          KEY=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')

          echo "URL length after trim: ${#URL}"
          echo "KEY length after trim: ${#KEY}"

          case "$URL" in
            https://*.supabase.co)
              echo "URL format: OK"
              ;;
            *)
              echo "URL format: NG"
              echo "Expected form is https://xxxxxxxx.supabase.co"
              exit 1
              ;;
          esac

          if [ "${#KEY}" -lt 100 ]; then
            echo "KEY looks too short. Check the secret SUPABASE_ANON_KEY."
            exit 1
          fi

          CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            "$URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          CURL_EXIT=$?

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "curl failed with exit code $CURL_EXIT"
            exit 1
          fi

          echo "HTTP status: $CODE"

          if [ "$CODE" = "200" ]; then
            echo "OK: Supabase is awake."
            exit 0
          elif [ "$CODE" = "540" ]; then
            echo "ERROR: Project is paused. Resume it from the Supabase dashboard."
            exit 1
          else
            echo "ERROR: Unexpected status $CODE"
            cat /tmp/body.txt
            exit 1
          fi
      - name: Keep repository active
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Touch heartbeat file if inactive
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Days since last commit: $DAYS"
          if [ "$DAYS" -lt 41 ]; then
            echo "Recent enough. Nothing to do."
            exit 0
          fi
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat
          git commit -m "chore: keep scheduled workflows alive"
          git push
